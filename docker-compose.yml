services:
  # ==========================================
  # 1. BASE DE DATOS (PostgreSQL 16)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: tci_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planta_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planta_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. BACKEND (FastAPI + SQLModel + uv)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tci_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/planta_db
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # 3. FRONTEND (React + Vite + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_HEALTH_URL: http://localhost:8000/health
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-3x00000000000000000000FF}
    container_name: tci_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
