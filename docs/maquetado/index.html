<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Sistema de Gestión de Mantenimiento</h1>
        </div>
    </header>

    <main>
        <!-- Sección: Formulario para reportar incidencias de máquinas -->
        <section id="reportes" class="reportes">
            <div class="container">
                <h2>Crear Reporte de Incidencia</h2>
                <article>
                    <!-- Formulario de reporte: captura información sobre la máquina dañada, problema y evidencia -->
                    <form id="form-incidencia" action="#" method="POST"> <!-- Renombre id-->
                        <!-- Identificación de máquina mediante código QR -->
                        <div class="form-group">
                            <label for="codigo-maquina">Máquina (Código QR):</label>
                            <input type="text" id="codigo-maquina" name="codigo-maquina" placeholder="Código QR de la máquina" required> <!-- Renombre id-->
                        </div>

                        <!-- Descripción detallada del problema observado -->
                        <div class="form-group">
                            <label for="descripcion">Descripción del Problema:</label>
                            <textarea id="descripcion" name="descripcion" placeholder="Describí el problema que observaste…" rows="5" required></textarea>
                        </div>

                        <!-- Evidencia fotográfica: acepta múltiples imágenes para documentar el daño -->
                        <div class="form-group">
                            <label for="foto">Fotos:</label>
                            <input type="file" id="foto" name="foto" accept="image/*" multiple> <!-- Renombre id-->
                        </div>

                        <!-- Turno en el que ocurrió la incidencia -->
                        <div class="form-group">
                            <label for="turno">Turno:</label>
                            <select id="turno" name="turno" required>
                                <option value="">-- Selecciona un turno --</option>
                                <option value="mañana">Mañana</option>
                                <option value="tarde">Tarde</option>
                                <option value="noche">Noche</option>
                            </select>
                        </div>

                        <!-- Botón para enviar el reporte al sistema -->
                        <button type="submit" id="btn-enviar" disabled>Enviar Reporte</button> <!-- Renombre id-->
                    </form>

                    <!-- Feedback al operario tras registrar la incidencia -->
                    <div id="preview-incidencia" hidden></div>
                </article>
            </div>
        </section>

        <section id="estado" class="estado">
            <div class="container">
                <h2>Estado de Máquinas</h2>

                <!-- Se oculta al registrarse la primera incidencia -->
                <p id="estado-vacio" class="estado-vacio">Todavía no hay incidencias registradas.</p>

                <!-- Las tarjetas se insertan por JS, la más reciente primero -->
                <div id="lista-incidencias" class="lista-incidencias"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 TCI S32 - Sistema de Gestión de Mantenimiento. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="app.js" defer></script>

</body>
</html>
