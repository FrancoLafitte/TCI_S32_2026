openapi: 3.1.0

info:
  title: API de Gestión de Stock y Mantenimiento de Planta
  version: 0.2.0
  description: |
    Contrato v0.2 del TCI S32 - Desarrollo de Software 2026.
    Fuente de verdad del dominio: docs/dominio. Las reglas se citan como RN-01 a RN-10.
    Los cambios respecto de v0.1 están explicados en docs/contrato/CAMBIOS_v0.2.md.

    Decisiones que reflejan el dominio:
    - La lista de compras es una VISTA DERIVADA (solo GET), no una entidad.
    - Los movimientos de stock son INMUTABLES (solo GET).
    - stockDisponible = stockFisico - stockReservado. El umbral se evalúa sobre el disponible (RN-02).
    - El turno de una incidencia se deriva del timestamp, no lo envía el cliente.
    - RN-09 (notificación por correo) es un efecto de los endpoints, no tiene endpoint propio.

    PENDIENTE DE VALIDAR CON LA CATEDRA: los enums de `estado` son provisorios.

    Para usar el mock con Prism hay que enviar un header Authorization con cualquier
    valor, por ejemplo `Authorization: Bearer test`. Sin header Prism responde 401.
    La única excepción es GET /health, que es público.

servers:
  - url: http://localhost:4010
    description: Mock server (Prism)
  - url: http://localhost:8000
    description: Backend real (FastAPI). En M3 solo implementa /health.

security:
  - bearerAuth: []

tags:
  - name: Sistema
  - name: Tablero
  - name: Repuestos
  - name: Maquinas
  - name: Incidencias
  - name: Reparaciones
  - name: Compras
  - name: Reservas

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio (walking skeleton)
      description: "Público, sin token. Lo usa el frontend para mostrar ONLINE / OFFLINE."
      security: []
      responses:
        "200":
          description: Servicio funcionando
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example:
                {
                  status: "ok",
                  servicio: "api-stock-planta",
                  version: "0.2.0",
                  timestamp: "2026-10-30T13:00:00Z",
                }

  /tablero/resumen:
    get:
      tags: [Tablero]
      summary: Indicadores del tablero (gerencia y almacén)
      description: "Contadores calculados. No es una entidad. Roles: todos."
      responses:
        "200":
          description: Resumen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResumenTablero" }
              example:
                totalRepuestos: 1420
                repuestosBajoUmbral: 3
                incidenciasActivas: 5
                incidenciasUrgentes: 2
                reservasActivas: 3
                pedidosPendientes: 4
                pedidosUrgentes: 2
                ultimoIngreso:
                  {
                    repuestoCodigo: "REP-7742",
                    nombre: "Válvula Sanitaria Diafragma EPDM",
                    cantidad: 4,
                    fecha: "2026-10-30T11:00:00Z",
                  }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /repuestos:
    get:
      tags: [Repuestos]
      summary: Consultar repuestos
      description: |
        Búsqueda por nombre, descripción, máquina o código. Roles: todos.
        (El mock de Prism NO filtra: siempre devuelve el mismo ejemplo.)
      parameters:
        - name: q
          in: query
          description: Texto libre (nombre, descripción o código).
          schema: { type: string }
        - name: maquinaCodigo
          in: query
          description: Filtra repuestos aplicables a esa máquina.
          schema: { type: string }
        - name: bajoUmbral
          in: query
          description: Si es true, solo repuestos con stockDisponible <= umbralMinimo (RN-02).
          schema: { type: boolean }
      responses:
        "200":
          description: Lista de repuestos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Repuesto" }
              example:
                - id: 1
                  codigo: "REP-7742"
                  nombre: "Válvula Sanitaria Diafragma EPDM"
                  descripcion: "Válvula 1.5 pulgadas, PTFE / EPDM FDA"
                  stockFisico: 6
                  stockReservado: 0
                  stockDisponible: 6
                  umbralMinimo: 4
                  precioUnitario: 320
                  ubicacion:
                    {
                      codigo: "A-03-12",
                      descripcion: "Estante A-03-12 · Nivel 2",
                    }
                  maquinasCompatibles: ["FR-04", "CA-01"]
                - id: 2
                  codigo: "REP-1029"
                  nombre: "Junta Tórica EPDM Sanitaria 25mm"
                  descripcion: "Junta para sello de bomba peristáltica"
                  stockFisico: 3
                  stockReservado: 1
                  stockDisponible: 2
                  umbralMinimo: 4
                  precioUnitario: 24.5
                  ubicacion:
                    {
                      codigo: "B-01-04",
                      descripcion: "Almacén B-01-04 · Gaveta Sellos",
                    }
                  maquinasCompatibles: ["FR-04"]
                - id: 3
                  codigo: "REP-3301"
                  nombre: "Sensor de Presión Piezorresistivo 4-20mA"
                  descripcion: "Rango 0-6 bar, calibración vigente"
                  stockFisico: 12
                  stockReservado: 0
                  stockDisponible: 12
                  umbralMinimo: 3
                  precioUnitario: 480
                  ubicacion:
                    {
                      codigo: "C-12",
                      descripcion: "Cajón C-12 · Instrumentación",
                    }
                  maquinasCompatibles: ["ER-01"]
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Repuestos]
      summary: Dar de alta un repuesto
      description: "Roles: Encargado."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepuestoNuevo" }
            example:
              codigo: "REP-0002"
              nombre: "Correa dentada T10"
              umbralMinimo: 3
              ubicacion: { codigo: "B-01-05" }
      responses:
        "201":
          description: Repuesto creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repuesto" }
              example:
                id: 4
                codigo: "REP-0002"
                nombre: "Correa dentada T10"
                stockFisico: 0
                stockReservado: 0
                stockDisponible: 0
                umbralMinimo: 3
                ubicacion: { codigo: "B-01-05" }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Ya existe un repuesto con ese código.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  codigo: "CODIGO_DUPLICADO",
                  mensaje: "Ya existe un repuesto con el código REP-0002",
                }

  /repuestos/{codigo}:
    get:
      tags: [Repuestos]
      summary: Obtener un repuesto por código (escaneo QR o de barras)
      description: "Roles: todos."
      parameters:
        - $ref: "#/components/parameters/CodigoRepuesto"
      responses:
        "200":
          description: Repuesto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repuesto" }
              example:
                id: 1
                codigo: "REP-7742"
                nombre: "Válvula Sanitaria Diafragma EPDM"
                descripcion: "Válvula 1.5 pulgadas, PTFE / EPDM FDA"
                stockFisico: 3
                stockReservado: 0
                stockDisponible: 3
                umbralMinimo: 4
                precioUnitario: 320
                ubicacion:
                  {
                    codigo: "A-03-12",
                    descripcion: "Estante A-03-12 · Nivel 2",
                  }
                maquinasCompatibles: ["FR-04", "CA-01"]
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /repuestos/{codigo}/ingresos:
    post:
      tags: [Repuestos]
      summary: Ingresar stock recibido (sin pedido de compra previo)
      description: |
        NUEVO en v0.2 (pantalla "Ingresar repuesto"). RN-08: carga stock físico con su
        ubicación y lote. Genera un movimiento de tipo `entrada`. Si el ingreso viene de un
        pedido de compra se usa POST /pedidos-compra/{id}/recepcion. Roles: Encargado, Mantenimiento.
      parameters:
        - $ref: "#/components/parameters/CodigoRepuesto"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngresoNuevo" }
            example:
              {
                cantidad: 10,
                lote: "L-2024-V98",
                ubicacion: { codigo: "A-03-12" },
              }
      responses:
        "201":
          description: Ingreso registrado; devuelve el repuesto con el stock actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repuesto" }
              example:
                id: 1
                codigo: "REP-7742"
                nombre: "Válvula Sanitaria Diafragma EPDM"
                stockFisico: 13
                stockReservado: 0
                stockDisponible: 13
                umbralMinimo: 4
                ubicacion:
                  {
                    codigo: "A-03-12",
                    descripcion: "Estante A-03-12 · Nivel 2",
                  }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /repuestos/{codigo}/movimientos:
    get:
      tags: [Repuestos]
      summary: Historial del repuesto (trazabilidad)
      description: "RN-06. Los movimientos son inmutables. Roles: todos."
      parameters:
        - $ref: "#/components/parameters/CodigoRepuesto"
      responses:
        "200":
          description: Movimientos en orden cronológico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MovimientoStock" }
              example:
                - {
                    id: 101,
                    tipo: entrada,
                    cantidad: 10,
                    fecha: "2026-09-01T10:15:00Z",
                    usuario: "encargado1",
                    lote: "L-2024-V98",
                    referencia: { tipo: pedido_compra, id: 7 },
                  }
                - {
                    id: 102,
                    tipo: consumo,
                    cantidad: 1,
                    fecha: "2026-09-10T08:30:00Z",
                    usuario: "mantenimiento3",
                    referencia: { tipo: reparacion, id: 21 },
                  }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /repuestos/reconocimiento:
    post:
      tags: [Repuestos]
      summary: Reconocer un repuesto a partir de una foto
      description: "Devuelve candidatos ordenados por confianza. Roles: Operario, Mantenimiento, Encargado."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto: { type: string, format: binary }
      responses:
        "200":
          description: Candidatos reconocidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CandidatoReconocimiento" }
              example:
                - confianza: 0.93
                  repuesto:
                    {
                      id: 2,
                      codigo: "REP-1029",
                      nombre: "Junta Tórica EPDM Sanitaria 25mm",
                      stockFisico: 3,
                      stockReservado: 1,
                      stockDisponible: 2,
                      umbralMinimo: 4,
                      ubicacion: { codigo: "B-01-04" },
                    }
                  maquinasCompatibles: ["FR-04"]
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /maquinas:
    get:
      tags: [Maquinas]
      summary: Listar máquinas
      description: "NUEVO en v0.2 (selector de equipo y tablero de gerencia). Roles: todos."
      responses:
        "200":
          description: Máquinas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Maquina" }
              example:
                - {
                    codigo: "FR-04",
                    nombre: "Fraccionador F-04",
                    tipo: "Fraccionador",
                    ejemplar: "4",
                    linea: "Línea B · Sala Limpia ISO 7",
                    estado: operativa,
                    repuestosAMantener: ["REP-1029", "REP-7742"],
                  }
                - {
                    codigo: "BT-02",
                    nombre: "Banda Transporte BT-02",
                    tipo: "Banda transportadora",
                    ejemplar: "2",
                    linea: "Línea Envasado Primario",
                    estado: operativa,
                    repuestosAMantener: [],
                  }
                - {
                    codigo: "ER-01",
                    nombre: "Envasadora Rotativa ER-01",
                    tipo: "Envasadora",
                    ejemplar: "1",
                    linea: "Línea Blíster 3",
                    estado: en_mantenimiento,
                    repuestosAMantener: ["REP-3301"],
                  }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Maquinas]
      summary: Registrar una máquina nueva
      description: "RN-07. Registra la máquina y su lista de repuestos a mantener en stock. Roles: Encargado."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaquinaNueva" }
            example:
              {
                codigo: "CA-03",
                nombre: "Caldera CA-03",
                tipo: "Caldera",
                ejemplar: "3",
                linea: "Sala Térmica",
                repuestosAMantener: ["REP-7742"],
              }
      responses:
        "201":
          description: Máquina registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Maquina" }
              example:
                {
                  codigo: "CA-03",
                  nombre: "Caldera CA-03",
                  tipo: "Caldera",
                  ejemplar: "3",
                  linea: "Sala Térmica",
                  estado: operativa,
                  repuestosAMantener: ["REP-7742"],
                }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409":
          description: Ya existe una máquina con ese código.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  codigo: "CODIGO_DUPLICADO",
                  mensaje: "Ya existe una máquina con el código CA-03",
                }

  /maquinas/{codigo}:
    get:
      tags: [Maquinas]
      summary: Obtener una máquina por código (escaneo QR de la máquina)
      description: "Roles: todos."
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string }
          example: "FR-04"
      responses:
        "200":
          description: Máquina
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Maquina" }
              example:
                {
                  codigo: "FR-04",
                  nombre: "Fraccionador F-04",
                  tipo: "Fraccionador",
                  ejemplar: "4",
                  linea: "Línea B · Sala Limpia ISO 7",
                  estado: operativa,
                  repuestosAMantener: ["REP-1029", "REP-7742"],
                }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /incidencias:
    get:
      tags: [Incidencias]
      summary: Listar incidencias (tablero y triage)
      description: "Roles: Mantenimiento, Encargado, Gerencia."
      parameters:
        - name: estado
          in: query
          schema: { $ref: "#/components/schemas/EstadoIncidencia" }
        - name: prioridad
          in: query
          schema: { $ref: "#/components/schemas/Urgencia" }
        - name: maquinaCodigo
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Lista de incidencias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incidencia" }
              example:
                - id: 204
                  maquinaCodigo: "FR-04"
                  maquina:
                    {
                      codigo: "FR-04",
                      nombre: "Fraccionador F-04",
                      linea: "Línea B · Dosificación Estéril",
                    }
                  descripcion: "Fuga de fluido constante en sello de bomba peristáltica B2 durante el lote 9942."
                  tipoFalla: fuga_fluido
                  prioridad: urgente
                  fotos: ["https://ejemplo.local/fotos/204-1.jpg"]
                  repuestosEstimados:
                    [{ repuestoCodigo: "REP-1029", cantidad: 1 }]
                  estado: abierta
                  turno: manana
                  reportadaPor: "Juan P."
                  creadaEn: "2026-10-30T12:15:00Z"
                - id: 202
                  maquinaCodigo: "BT-02"
                  maquina:
                    {
                      codigo: "BT-02",
                      nombre: "Banda Transporte BT-02",
                      linea: "Línea Envasado Primario",
                    }
                  descripcion: "Desalineación leve de guía lateral y vibración audible en rodillo motor."
                  tipoFalla: ruido_anomalo
                  prioridad: normal
                  fotos: []
                  estado: abierta
                  turno: manana
                  reportadaPor: "Carlos M."
                  creadaEn: "2026-10-30T11:00:00Z"
                - id: 198
                  maquinaCodigo: "ER-01"
                  maquina:
                    {
                      codigo: "ER-01",
                      nombre: "Envasadora Rotativa ER-01",
                      linea: "Línea Blíster 3",
                    }
                  descripcion: "Fallo intermitente en sensor óptico de alimentación. Requiere reemplazo de sensor."
                  tipoFalla: otro
                  prioridad: normal
                  fotos: []
                  estado: espera_repuesto
                  turno: manana
                  reportadaPor: "Lucía R."
                  creadaEn: "2026-10-30T09:45:00Z"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      tags: [Incidencias]
      summary: Reportar una incidencia
      description: |
        Identifica la máquina por su código y adjunta fotos. El turno se deriva del
        timestamp del servidor. Notifica por correo (RN-09). Roles: Operario, Mantenimiento.
        v0.2 agrega prioridad, tipoFalla y repuestosEstimados (opcionales salvo prioridad).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [maquinaCodigo, descripcion, prioridad]
              properties:
                maquinaCodigo: { type: string }
                descripcion: { type: string }
                prioridad: { $ref: "#/components/schemas/Urgencia" }
                tipoFalla: { $ref: "#/components/schemas/TipoFalla" }
                repuestosEstimados:
                  type: string
                  description: 'JSON serializado de un array de LineaPedido, ej. [{"repuestoCodigo":"REP-1029","cantidad":1}]'
                fotos:
                  type: array
                  maxItems: 3
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Incidencia creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incidencia" }
              example:
                id: 205
                maquinaCodigo: "FR-04"
                maquina:
                  {
                    codigo: "FR-04",
                    nombre: "Fraccionador F-04",
                    linea: "Línea B · Sala Limpia ISO 7",
                  }
                descripcion: "Fuga de fluido constante en el sello de la bomba peristáltica B2."
                tipoFalla: fuga_fluido
                prioridad: urgente
                fotos: []
                estado: abierta
                turno: manana
                reportadaPor: "operario1"
                creadaEn: "2026-10-30T13:42:00Z"
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /incidencias/{id}:
    get:
      tags: [Incidencias]
      summary: Obtener una incidencia
      description: "Roles: Mantenimiento, Encargado, Gerencia."
      parameters:
        - $ref: "#/components/parameters/IdEntero"
      responses:
        "200":
          description: Incidencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incidencia" }
              example:
                id: 204
                maquinaCodigo: "FR-04"
                maquina:
                  {
                    codigo: "FR-04",
                    nombre: "Fraccionador F-04",
                    linea: "Línea B · Dosificación Estéril",
                  }
                descripcion: "Fuga de fluido constante en sello de bomba peristáltica B2 durante el lote 9942."
                tipoFalla: fuga_fluido
                prioridad: urgente
                fotos: ["https://ejemplo.local/fotos/204-1.jpg"]
                repuestosEstimados:
                  [{ repuestoCodigo: "REP-1029", cantidad: 1 }]
                estado: abierta
                turno: manana
                reportadaPor: "Juan P."
                creadaEn: "2026-10-30T12:15:00Z"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reparaciones:
    post:
      tags: [Reparaciones]
      summary: Iniciar una reparación sobre una incidencia
      description: "Pasa la incidencia a en_reparacion. Roles: Mantenimiento."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incidenciaId]
              properties:
                incidenciaId: { type: integer }
            example: { incidenciaId: 204 }
      responses:
        "201":
          description: Reparación creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reparacion" }
              example:
                {
                  id: 21,
                  incidenciaId: 204,
                  lineasUso: [],
                  iniciadaEn: "2026-10-30T13:10:00Z",
                }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /reparaciones/{id}/lineas-uso:
    post:
      tags: [Reparaciones]
      summary: Registrar el uso de un repuesto (descuento por escaneo)
      description: |
        RN-01: descuenta `cantidad` del stock físico; si quedaría < 0 → 409 STOCK_INSUFICIENTE.
        RN-05: si las unidades están reservadas para otra cosa → 409 REPUESTO_RESERVADO.
        RN-02: si tras el descuento stockDisponible <= umbralMinimo, se genera una alerta.
        Notifica por correo (RN-09). Roles: Mantenimiento.
      parameters:
        - $ref: "#/components/parameters/IdEntero"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineaUsoNueva" }
            example: { repuestoCodigo: "REP-1029", cantidad: 1 }
      responses:
        "201":
          description: Línea de uso registrada y stock actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadoLineaUso" }
              example:
                lineaUso:
                  {
                    id: 55,
                    reparacionId: 21,
                    repuestoCodigo: "REP-1029",
                    cantidad: 1,
                  }
                repuesto:
                  {
                    id: 2,
                    codigo: "REP-1029",
                    nombre: "Junta Tórica EPDM Sanitaria 25mm",
                    stockFisico: 2,
                    stockReservado: 1,
                    stockDisponible: 1,
                    umbralMinimo: 4,
                    ubicacion: { codigo: "B-01-04" },
                  }
                alertaGenerada: true
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Stock insuficiente (RN-01) o repuesto reservado (RN-05).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                stockInsuficiente:
                  summary: RN-01
                  value:
                    {
                      codigo: "STOCK_INSUFICIENTE",
                      mensaje: "El stock físico no alcanza para la cantidad pedida",
                    }
                repuestoReservado:
                  summary: RN-05
                  value:
                    {
                      codigo: "REPUESTO_RESERVADO",
                      mensaje: "Las unidades disponibles están reservadas para un mantenimiento preventivo",
                    }

  /reparaciones/{id}/cierre:
    post:
      tags: [Reparaciones]
      summary: Cerrar una reparación (registrar el arreglo)
      description: |
        NUEVO en v0.2 (pantalla "Reportar arreglo"). Guarda el trabajo realizado, deja la
        incidencia en `resuelta` y la máquina en el estado indicado. Roles: Mantenimiento.
      parameters:
        - $ref: "#/components/parameters/IdEntero"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CierreReparacion" }
            example:
              {
                minutosIntervencion: 45,
                accionCorrectiva: reemplazo_pieza,
                notas: "Se reemplazó la junta EPDM. Prueba de estanqueidad OK.",
                estadoMaquina: operativa,
              }
      responses:
        "200":
          description: Reparación cerrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reparacion" }
              example:
                id: 21
                incidenciaId: 204
                lineasUso:
                  [
                    {
                      id: 55,
                      reparacionId: 21,
                      repuestoCodigo: "REP-1029",
                      cantidad: 1,
                    },
                  ]
                iniciadaEn: "2026-10-30T13:10:00Z"
                cerradaEn: "2026-10-30T13:55:00Z"
                minutosIntervencion: 45
                accionCorrectiva: reemplazo_pieza
                notas: "Se reemplazó la junta EPDM. Prueba de estanqueidad OK."
                estadoMaquina: operativa
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La reparación ya estaba cerrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  codigo: "ESTADO_INVALIDO",
                  mensaje: "La reparación ya fue cerrada",
                }

  /lista-compras:
    get:
      tags: [Compras]
