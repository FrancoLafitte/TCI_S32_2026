      tags: [Compras]
      summary: Agregar un requerimiento manual a la lista de compras
      description: "Roles: Encargado."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequerimientoManualNuevo" }
            example:
              {
                repuestoCodigo: "REP-5509",
                cantidadSugerida: 5,
                motivo: "Previsión para parada de noviembre",
              }
      responses:
        "201":
          description: Requerimiento agregado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemListaCompras" }
              example:
                {
                  origen: manual,
                  repuestoCodigo: "REP-5509",
                  nombre: "Cápsula Filtrante Estéril 0.22um",
                  cantidadSugerida: 5,
                  motivo: "Previsión para parada de noviembre",
                }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /alertas:
    get:
      tags: [Compras]
      summary: Listar alertas de umbral
      description: "RN-02. Roles: Encargado, Gerencia."
      responses:
        "200":
          description: Alertas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alerta" }
              example:
                - {
                    id: 3,
                    repuestoCodigo: "REP-1029",
                    stockDisponible: 2,
                    umbralMinimo: 4,
                    generadaEn: "2026-10-30T12:40:00Z",
                  }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /pedidos-compra:
    get:
      tags: [Compras]
      summary: Listar pedidos de compra
      description: "Roles: Mantenimiento, Encargado, Gerencia."
      parameters:
        - name: estado
          in: query
          schema: { $ref: "#/components/schemas/EstadoPedido" }
      responses:
        "200":
          description: Pedidos de compra
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PedidoCompra" }
              example:
                - {
                    id: 88,
                    lineas: [{ repuestoCodigo: "REP-1029", cantidad: 10 }],
                    urgencia: urgente,
                    estado: pendiente,
                    creadoEn: "2026-10-30T11:20:00Z",
                    montoEstimado: 4850,
                  }
                - {
                    id: 86,
                    lineas: [{ repuestoCodigo: "REP-3301", cantidad: 2 }],
                    urgencia: urgente,
                    estado: pendiente,
                    creadoEn: "2026-10-29T16:40:00Z",
