                  },
                ]
      responses:
        "201":
          description: Recepción registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoCompra" }
              example:
                {
                  id: 88,
                  lineas: [{ repuestoCodigo: "REP-1029", cantidad: 10 }],
                  urgencia: urgente,
                  estado: recibido,
                  creadoEn: "2026-10-30T11:20:00Z",
                }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El pedido ya fue recibido o fue cancelado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  codigo: "ESTADO_INVALIDO",
                  mensaje: "El pedido ya fue recibido",
                }

  /reservas:
    get:
      tags: [Reservas]
      summary: Listar reservas
      description: "Roles: Mantenimiento, Encargado, Gerencia."
      parameters:
        - name: estado
          in: query
          schema: { $ref: "#/components/schemas/EstadoReserva" }
      responses:
        "200":
          description: Reservas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reserva" }
              example:
                - {
                    id: 104,
                    lineas: [{ repuestoCodigo: "REP-1029", cantidad: 1 }],
                    motivo: "Preventivo Fraccionador F-04",
                    maquinaCodigo: "FR-04",
                    urgencia: urgente,
                    estado: activa,
                    solicitadaPor: "Juan Pérez",
                    incidenciaId: 204,
                    creadaEn: "2026-10-30T13:20:00Z",
                  }
                - {
                    id: 105,
                    lineas: [{ repuestoCodigo: "REP-7742", cantidad: 2 }],
                    motivo: "Preventivo Llenadora Aséptica",
                    maquinaCodigo: "LL-01",
                    urgencia: urgente,
                    estado: activa,
                    solicitadaPor: "Carlos M.",
                    incidenciaId: 208,
                    creadaEn: "2026-10-30T12:45:00Z",
                  }
                - {
                    id: 102,
                    lineas: [{ repuestoCodigo: "REP-3301", cantidad: 1 }],
                    motivo: "Mantenimiento programado ciclo MP-08",
                    maquinaCodigo: "ET-01",
                    urgencia: normal,
                    estado: activa,
                    solicitadaPor: "Lucía R.",
                    creadaEn: "2026-10-30T08:00:00Z",
                  }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Reservas]
      summary: Reservar repuestos para un mantenimiento preventivo
      description: "Aumenta stockReservado y reduce stockDisponible. Movimientos `reserva`. Roles: Encargado, Mantenimiento."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservaNueva" }
            example:
              {
                motivo: "Preventivo Fraccionador F-04",
                maquinaCodigo: "FR-04",
                lineas: [{ repuestoCodigo: "REP-1029", cantidad: 1 }],
              }
      responses:
        "201":
          description: Reserva creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reserva" }
              example:
                {
                  id: 106,
                  lineas: [{ repuestoCodigo: "REP-1029", cantidad: 1 }],
                  motivo: "Preventivo Fraccionador F-04",
                  maquinaCodigo: "FR-04",
                  urgencia: normal,
                  estado: activa,
                  creadaEn: "2026-10-30T13:55:00Z",
                }
        "400": { $ref: "#/components/responses/SolicitudInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: No hay stock disponible suficiente para reservar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  codigo: "STOCK_INSUFICIENTE",
                  mensaje: "El stock disponible no alcanza para la reserva",
                }

  /reservas/{id}/liberacion:
    post:
      tags: [Reservas]
      summary: Liberar una reserva (con autorización)
      description: |
        RN-05. Exige autorización de un usuario con rol Encargado. En el frontend es el
        botón "Autorizar uso" de la pantalla "Autorización de reservas". Roles: Encargado.
      parameters:
        - $ref: "#/components/parameters/IdEntero"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
            example:
              { motivo: "Se necesita la pieza para la incidencia urgente #204" }
      responses:
        "200":
          description: Reserva liberada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reserva" }
              example:
                {
                  id: 104,
                  lineas: [{ repuestoCodigo: "REP-1029", cantidad: 1 }],
                  motivo: "Preventivo Fraccionador F-04",
                  estado: liberada,
                }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403":
          description: Solo un Encargado puede autorizar la liberación (RN-05).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  codigo: "SIN_PERMISO",
                  mensaje: "La liberación exige el rol Encargado",
                }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La reserva no está activa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  codigo: "ESTADO_INVALIDO",
                  mensaje: "La reserva ya fue liberada o ejecutada",
                }

  /reservas/{id}/ejecucion:
    post:
      tags: [Reservas]
      summary: Ejecutar el mantenimiento preventivo reservado
      description: "RN-10. Descuenta stock físico y libera la reserva en la MISMA transacción. Roles: Mantenimiento, Encargado."
      parameters:
        - $ref: "#/components/parameters/IdEntero"
      responses:
        "200":
          description: Preventivo ejecutado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reserva" }
              example:
                {
                  id: 104,
                  lineas: [{ repuestoCodigo: "REP-1029", cantidad: 1 }],
                  motivo: "Preventivo Fraccionador F-04",
                  estado: ejecutada,
                }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: La reserva no está activa o el stock físico no alcanza.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                {
                  codigo: "ESTADO_INVALIDO",
                  mensaje: "La reserva no está activa",
                }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        El rol (operario, mantenimiento, encargado, gerencia) viaja en el token y se
        valida en cada endpoint (autorización por rol).

  parameters:
    CodigoRepuesto:
      name: codigo
      in: path
      required: true
      description: Código QR o de barras del repuesto.
      schema: { type: string }
      example: "REP-7742"
    IdEntero:
      name: id
      in: path
      required: true
      schema: { type: integer }
      example: 204

  responses:
    SolicitudInvalida:
      description: Solicitud inválida (datos faltantes o con formato incorrecto).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              codigo: "SOLICITUD_INVALIDA",
              mensaje: "El campo cantidad debe ser un entero mayor o igual a 1",
            }
    NoAutenticado:
      description: Falta el token o es inválido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            { codigo: "NO_AUTENTICADO", mensaje: "Token ausente o inválido" }
    SinPermiso:
      description: El rol del usuario no permite esta operación.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              codigo: "SIN_PERMISO",
              mensaje: "Tu rol no permite esta operación",
            }
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              codigo: "NO_ENCONTRADO",
              mensaje: "No se encontró el recurso pedido",
            }

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string }
        mensaje: { type: string }

    Health:
      type: object
      required: [status, servicio, version, timestamp]
      properties:
        status: { type: string, enum: [ok] }
        servicio: { type: string }
        version: { type: string }
        timestamp: { type: string, format: date-time }

    ResumenTablero:
      type: object
      required:
        [
          totalRepuestos,
          repuestosBajoUmbral,
          incidenciasActivas,
          incidenciasUrgentes,
          reservasActivas,
          pedidosPendientes,
          pedidosUrgentes,
        ]
      properties:
        totalRepuestos: { type: integer }
        repuestosBajoUmbral: { type: integer }
        incidenciasActivas: { type: integer }
        incidenciasUrgentes: { type: integer }
        reservasActivas: { type: integer }
        pedidosPendientes: { type: integer }
        pedidosUrgentes: { type: integer }
        ultimoIngreso:
          type: object
          properties:
            repuestoCodigo: { type: string }
            nombre: { type: string }
            cantidad: { type: integer }
            fecha: { type: string, format: date-time }

    Ubicacion:
      type: object
      required: [codigo]
      properties:
        codigo:
          {
            type: string,
            description: "Código alfanumérico, por ejemplo A-03-12.",
          }
        descripcion: { type: string }

    Repuesto:
      type: object
      required:
        [
          id,
          codigo,
          nombre,
          stockFisico,
          stockReservado,
          stockDisponible,
          umbralMinimo,
          ubicacion,
        ]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        stockFisico: { type: integer, minimum: 0 }
        stockReservado: { type: integer, minimum: 0 }
        stockDisponible:
          { type: integer, description: "stockFisico - stockReservado" }
        umbralMinimo: { type: integer, minimum: 0 }
        precioUnitario:
          {
            type: number,
            minimum: 0,
            description: "NUEVO v0.2. Precio de referencia (USD).",
          }
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }
        maquinasCompatibles:
          type: array
          description: "NUEVO v0.2. Códigos de máquina donde se usa."
          items: { type: string }

    RepuestoNuevo:
      type: object
      required: [codigo, nombre, umbralMinimo, ubicacion]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        umbralMinimo: { type: integer, minimum: 0 }
        precioUnitario: { type: number, minimum: 0 }
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }

    IngresoNuevo:
      type: object
      required: [cantidad, ubicacion]
      properties:
        cantidad: { type: integer, minimum: 1 }
        lote: { type: string }
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }

    CandidatoReconocimiento:
      type: object
      required: [confianza, repuesto]
      properties:
        confianza: { type: number, minimum: 0, maximum: 1 }
        repuesto: { $ref: "#/components/schemas/Repuesto" }
        maquinasCompatibles:
          type: array
          items: { type: string }

    TipoMovimiento:
      type: string
      enum: [entrada, salida, reserva, liberacion, consumo]

    MovimientoStock:
      type: object
      required: [id, tipo, cantidad, fecha, usuario]
      properties:
        id: { type: integer }
        tipo: { $ref: "#/components/schemas/TipoMovimiento" }
        cantidad: { type: integer, minimum: 1 }
        fecha: { type: string, format: date-time }
        usuario: { type: string }
        lote: { type: string }
        referencia:
          type: object
          properties:
            tipo:
              {
                type: string,
                enum: [pedido_compra, reparacion, reserva, ingreso],
              }
            id: { type: integer }

    EstadoMaquina:
      type: string
      description: Provisorio, a validar con la cátedra.
      enum: [operativa, en_pruebas, en_mantenimiento, fuera_de_servicio]

    Maquina:
      type: object
      required: [codigo, tipo, ejemplar, estado]
      properties:
        codigo: { type: string }
        nombre:
          {
            type: string,
            description: "NUEVO v0.2. Nombre visible, ej. Fraccionador F-04.",
          }
        tipo: { type: string }
        ejemplar: { type: string }
        linea:
          {
            type: string,
            description: "NUEVO v0.2. Línea / sala donde está la máquina.",
          }
        estado: { $ref: "#/components/schemas/EstadoMaquina" }
        repuestosAMantener:
          type: array
          items: { type: string, description: "Código de repuesto" }

    MaquinaResumen:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        linea: { type: string }

    MaquinaNueva:
      type: object
      required: [codigo, tipo, ejemplar]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        tipo: { type: string }
        ejemplar: { type: string }
        linea: { type: string }
        repuestosAMantener:
          type: array
          items: { type: string }

    EstadoIncidencia:
      type: string
      description: Provisorio, a validar con la cátedra. v0.2 agrega espera_repuesto.
      enum: [abierta, en_reparacion, espera_repuesto, resuelta]

    TipoFalla:
      type: string
      description: NUEVO v0.2. Chips "Falla detectada" del mockup.
      enum: [perdida_presion, ruido_anomalo, fuga_fluido, otro]

    Turno:
      type: string
      enum: [manana, tarde, noche]

    Incidencia:
      type: object
      required:
        [id, maquinaCodigo, descripcion, prioridad, estado, turno, creadaEn]
      properties:
        id: { type: integer }
        maquinaCodigo: { type: string }
        maquina: { $ref: "#/components/schemas/MaquinaResumen" }
        descripcion: { type: string }
        tipoFalla: { $ref: "#/components/schemas/TipoFalla" }
        prioridad: { $ref: "#/components/schemas/Urgencia" }
        fotos:
          type: array
          items: { type: string, format: uri }
        repuestosEstimados:
          type: array
          items: { $ref: "#/components/schemas/LineaPedido" }
        estado: { $ref: "#/components/schemas/EstadoIncidencia" }
        turno: { $ref: "#/components/schemas/Turno" }
        reportadaPor: { type: string }
        creadaEn: { type: string, format: date-time }

    AccionCorrectiva:
      type: string
      description: NUEVO v0.2.
      enum: [reemplazo_pieza, calibracion, ajuste_mecanico, limpieza, otro]

    CierreReparacion:
      type: object
      required: [minutosIntervencion, accionCorrectiva, estadoMaquina]
      properties:
        minutosIntervencion: { type: integer, minimum: 1 }
        accionCorrectiva: { $ref: "#/components/schemas/AccionCorrectiva" }
        notas: { type: string }
        estadoMaquina: { $ref: "#/components/schemas/EstadoMaquina" }

    Reparacion:
      type: object
      required: [id, incidenciaId, lineasUso, iniciadaEn]
      properties:
        id: { type: integer }
        incidenciaId: { type: integer }
        lineasUso:
          type: array
          items: { $ref: "#/components/schemas/LineaUso" }
        iniciadaEn: { type: string, format: date-time }
        cerradaEn: { type: string, format: date-time }
        minutosIntervencion: { type: integer }
        accionCorrectiva: { $ref: "#/components/schemas/AccionCorrectiva" }
        notas: { type: string }
        estadoMaquina: { $ref: "#/components/schemas/EstadoMaquina" }

    LineaUsoNueva:
      type: object
      required: [repuestoCodigo, cantidad]
      properties:
        repuestoCodigo: { type: string }
        cantidad: { type: integer, minimum: 1 }

    LineaUso:
      type: object
      required: [id, reparacionId, repuestoCodigo, cantidad]
      properties:
        id: { type: integer }
        reparacionId: { type: integer }
        repuestoCodigo: { type: string }
        cantidad: { type: integer, minimum: 1 }

    ResultadoLineaUso:
      type: object
      required: [lineaUso, repuesto, alertaGenerada]
      properties:
        lineaUso: { $ref: "#/components/schemas/LineaUso" }
        repuesto: { $ref: "#/components/schemas/Repuesto" }
        alertaGenerada: { type: boolean }

    ItemListaCompras:
      type: object
      required: [origen, repuestoCodigo, nombre]
      properties:
        origen: { type: string, enum: [umbral, manual] }
        repuestoCodigo: { type: string }
        nombre: { type: string }
        stockDisponible: { type: integer }
        umbralMinimo: { type: integer }
        cantidadSugerida: { type: integer, minimum: 1 }
        precioUnitario: { type: number, minimum: 0 }
        urgencia: { $ref: "#/components/schemas/Urgencia" }
        motivo: { type: string }

    RequerimientoManualNuevo:
      type: object
      required: [repuestoCodigo, cantidadSugerida]
      properties:
        repuestoCodigo: { type: string }
        cantidadSugerida: { type: integer, minimum: 1 }
        motivo: { type: string }

    Alerta:
      type: object
      required: [id, repuestoCodigo, stockDisponible, umbralMinimo, generadaEn]
      properties:
        id: { type: integer }
        repuestoCodigo: { type: string }
        stockDisponible: { type: integer }
        umbralMinimo: { type: integer }
        generadaEn: { type: string, format: date-time }

    Urgencia:
      type: string
      enum: [normal, urgente]

    EstadoPedido:
      type: string
      description: Provisorio, a validar con la cátedra.
      enum: [pendiente, recibido, cancelado]

    LineaPedido:
      type: object
      required: [repuestoCodigo, cantidad]
      properties:
        repuestoCodigo: { type: string }
        cantidad: { type: integer, minimum: 1 }

    PedidoCompraNuevo:
      type: object
      required: [urgencia, lineas]
      properties:
        urgencia: { $ref: "#/components/schemas/Urgencia" }
        lineas:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LineaPedido" }

    PedidoCompra:
      type: object
      required: [id, lineas, urgencia, estado, creadoEn]
      properties:
        id: { type: integer }
        lineas:
          type: array
          items: { $ref: "#/components/schemas/LineaPedido" }
        urgencia: { $ref: "#/components/schemas/Urgencia" }
        estado: { $ref: "#/components/schemas/EstadoPedido" }
        creadoEn: { type: string, format: date-time }
        montoEstimado:
          {
            type: number,
            description: "NUEVO v0.2. Suma de precioUnitario x cantidad.",
          }

    RecepcionNueva:
      type: object
      required: [lineas]
      properties:
        delegadoA:
          type: string
          description: Usuario al que se delega la carga (RN-08).
        lineas:
          type: array
          minItems: 1
          items:
            type: object
            required: [repuestoCodigo, cantidad, ubicacion]
            properties:
              repuestoCodigo: { type: string }
              cantidad: { type: integer, minimum: 1 }
              lote: { type: string }
              ubicacion: { $ref: "#/components/schemas/Ubicacion" }

    EstadoReserva:
      type: string
      description: Provisorio, a validar con la cátedra.
      enum: [activa, liberada, ejecutada]

    ReservaNueva:
      type: object
      required: [motivo, lineas]
      properties:
        motivo: { type: string }
        maquinaCodigo: { type: string }
        urgencia: { $ref: "#/components/schemas/Urgencia" }
        incidenciaId: { type: integer }
        lineas:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LineaPedido" }

    Reserva:
      type: object
      required: [id, lineas, motivo, estado]
      properties:
        id: { type: integer }
        lineas:
          type: array
          items: { $ref: "#/components/schemas/LineaPedido" }
        motivo: { type: string }
        maquinaCodigo: { type: string, description: "NUEVO v0.2." }
        urgencia: { $ref: "#/components/schemas/Urgencia" }
        incidenciaId:
          {
            type: integer,
            description: "NUEVO v0.2. Incidencia que pide usar lo reservado.",
          }
        solicitadaPor: { type: string, description: "NUEVO v0.2." }
        creadaEn:
          { type: string, format: date-time, description: "NUEVO v0.2." }
        estado: { $ref: "#/components/schemas/EstadoReserva" }
