        Combina repuestos bajo umbral (RN-02) con requerimientos manuales del encargado.
        Roles: Encargado, Gerencia.
      responses:
        "200":
          description: Ítems de la lista de compras
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemListaCompras" }
              example:
                - {
                    origen: umbral,
                    repuestoCodigo: "REP-1029",
                    nombre: "Junta Tórica EPDM Sanitaria 25mm",
                    stockDisponible: 2,
                    umbralMinimo: 4,
                    cantidadSugerida: 10,
                    precioUnitario: 24.5,
                    urgencia: urgente,
                  }
                - {
                    origen: umbral,
                    repuestoCodigo: "REP-7742",
                    nombre: "Válvula Sanitaria Diafragma EPDM",
                    stockDisponible: 3,
                    umbralMinimo: 4,
                    cantidadSugerida: 4,
                    precioUnitario: 320,
                    urgencia: normal,
                  }
                - {
                    origen: manual,
                    repuestoCodigo: "REP-5509",
                    nombre: "Cápsula Filtrante Estéril 0.22um",
                    stockDisponible: 2,
                    umbralMinimo: 5,
                    cantidadSugerida: 5,
